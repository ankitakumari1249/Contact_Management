<!DOCTYPE html>
<html
  lang="en"
  th:replace="~{base :: parent(~{::#content},~{::title},~{::script} )}"
>
  <head>
    <title>Register Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body class="bg-gray-100 dark:bg-gray-900">
    <div id="content">
      <!-- Narrow container with proper margins and no overflow -->
      <div
        class="max-w-md mx-auto mt-6 px-4 sm:px-6 overflow-visible bg-gray-100 dark:bg-gray-900"
      >
        <div
          class="block p-6 border-t-8 border-blue-700 bg-white rounded-lg shadow hover:bg-gray-100 dark:bg-gray-800 dark:border-blue-700 dark:border-t-8 dark:hover:bg-gray-700"
        >
<!-- message here -->
<div th:replace="~{message::messagebox}"></div>

          <h5
            class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white"
          >
            Signup Here
          </h5>
          <p class="font-normal text-gray-700 dark:text-gray-400">
            Start managing contacts on cloud...
          </p>

          <form
            th:action="@{'/do-register'}"
            method="post"
            th:object="${userForm}"
            class="mt-5"
            novalidate
          >
            <!-- Name field -->
            <div class="mb-3">
              <label
                for="name"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                >Your Name</label
              >
              <input
                type="text"
                id="name"
                th:field="*{name}"
                placeholder="Enter Here"
                required
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
              />
              <p 
              th:if="${#fields.hasErrors('name')}"
              th:errors="*{name}"
              class="text-red-600 px-1 py-2 "></p>
            </div>

            <!-- Email field -->
            <div class="mb-3">
              <label
                for="email"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                >Your Email</label
              >
              <input
                type="email"
                id="email"
                th:field="*{email}"
                placeholder="Enter Here"
                required
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
              />
              <p 
              th:if="${#fields.hasErrors('email')}"
              th:errors="*{email}"
              class="text-red-600 px-1 py-2 "></p>
            </div>

            <!-- Password field -->
            <div class="mb-3">
              <label
                for="password"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                >New Password</label
              >
              <input
                type="password"
                id="password"
                th:field="*{password}"
                required
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
              />
               <p 
              th:if="${#fields.hasErrors('password')}"
              th:errors="*{password}"
              class="text-red-600 px-1 py-2 "></p>
            </div>

            <!-- Phone number -->
            <div class="mb-3">
              <label
                for="phone"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                >Phone No.</label
              >
              <input
                type="text"
                id="phone"
                th:field="*{phoneNumber}"
                placeholder="Enter Here"
                required
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
              />
               <p 
              th:if="${#fields.hasErrors('phoneNumber')}"
              th:errors="*{phoneNumber}"
              class="text-red-600 px-1 py-2 "></p>
            </div>

            <!-- About textarea -->
            <div class="mb-3">
              <label
                for="about"
                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                >Write something about yourself</label
              >
              <textarea
                id="about"
                rows="4"
                th:field="*{about}"
                placeholder="Write here"
                class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
              ></textarea>
               <p 
              th:if="${#fields.hasErrors('about')}"
              th:errors="*{about}"
              class="text-red-600 px-1 py-2 "></p>
            </div>

            <!-- Button section with wrapping and full width on mobile -->
            <div
              class="mb-3 flex flex-col sm:flex-row justify-center items-center gap-3"
            >
              <!-- Sign Up Button -->
              <button
                type="submit"
                class="w-full sm:w-auto px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white dark:bg-blue-400 dark:hover:bg-blue-500 shadow"
              >
                Sign Up
              </button>

              <!-- Reset Button -->
              <button
                type="reset"
                class="w-full sm:w-auto px-4 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white dark:bg-blue-400 dark:hover:bg-blue-500 shadow"
              >
                Reset
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      console.log("register page");
    </script>
  </body>
</html>
